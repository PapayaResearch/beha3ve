defaults:
  - agent: openai/gpt-5.6-luna
  - environment: browser
  - design: single
  - _self_
  - task: examples/live_wikipedia_research
  - experiment: null

seed: 0
schema_version: "1"
max_steps: ${task.max_steps}
progress: true
experiment_id: ${task.id}
run_id: ${experiment_id}
episode_id: ${task.id}-${seed}
output_dir: ${hydra:runtime.output_dir}/artifacts
hydra:
  run:
    dir: runs/${experiment_id}
  sweep:
    dir: runs/${experiment_id}-sweep
    subdir: ${hydra.job.num}
  job:
    chdir: false
