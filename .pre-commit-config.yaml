repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check harness integrations scripts tests run.py inspect_run.py replay_run.py
        language: system
        pass_filenames: false
