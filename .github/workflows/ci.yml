name: BEHA3VE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: beha3ve-ci
          auto-activate-base: false
      - run: pip install uv
      - run: uv pip install ruff==0.16.2
      - run: ruff check harness integrations scripts tests run.py inspect_run.py replay_run.py

  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      BROWSER_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python }}
          activate-environment: beha3ve-ci
          auto-activate-base: false
      - run: pip install uv
      - run: uv pip install -e ".[dev,browser,joblib]"
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q --junitxml=test-results/pytest.xml
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pytest-${{ matrix.python }}
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14

  viewer:
    name: Trace viewer tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/test_viewer_usage.cjs

  package:
    name: Package build and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: beha3ve-ci
          auto-activate-base: false
      - run: pip install uv
      - run: uv pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: uv pip install dist/*.whl
      - name: Check installed entry points and package data
        working-directory: ${{ runner.temp }}
        run: |
          view --help
          integrate --help
          python -c 'from importlib.resources import files; import integrations; root = files("harness"); assert root.joinpath("viewer/index.html").is_file(); assert root.joinpath("viewer/app.js").is_file(); assert root.joinpath("templates/driver.py.txt").is_file()'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          retention-days: 14
